{% extends "base.html" %}
{% load static i18n %}
{% block css %}
    <link rel="stylesheet" href="{% static "reserva/css/reserve.css" %}">
{% endblock css %}
{% block title %}{% trans "Change Password" %}{% endblock title %}
{% block content %}


<div class="container d-flex justify-content-center align-items-center text-light p-5">
    <form id="form" action="{% url "update_perfil_password_confirm" profile_id token %}" class="reserve-form" method="post">{% csrf_token %}
        {% include "partials/_messages.html" %}
        <div class="row p-3">
            <div class="form-group col-md-12 mb-2">
                <label for="password">{% trans "New password" %}</label>
                <input  required type="password" required class="form-control" value="" name="new_password" id="new_password" placeholder="{% trans "New password" %}" aria-label="new_password">
            </div>
            <div class="form-group col-md-12 mb-2">
                <label for="password">{% trans "Repeat password" %}</label>
                <input  required type="password" required class="form-control" value="" name="password_repeat" id="password_repeat" placeholder="{% trans "Repeat password" %}" aria-label="password_repeat">
            </div>
            <!-- Recaptcha removed for magic link flow as verified by token -->
            <div class="col-md-12 d-flex justify-content-center mt-3">
                <input class="btn btn-outline-info" type="submit" value="{% trans "Save" %}">
            </div>
        </div>
    </form>

</div>

{% endblock content %}
