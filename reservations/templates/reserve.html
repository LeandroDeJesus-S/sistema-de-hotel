{% extends 'base.html' %}
{% load static i18n %}

{% block css %}
    <link rel="stylesheet" href={% static "/reserva/css/reserve.css" %}>
{% endblock css %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center p-5">

    <form id="form" action="{% url 'reserve' room_pk %}" method="post" class="form reserve-form text-light" >{% csrf_token %}
        <div class="container">
            <div class="d-flex justify-content-center">
                {% include "partials/_messages.html" %}
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="checkin" class="form-label">{% trans "Check-In" %}</label>
                        <input required id="checkin" name="checkin" type="date" class="form-control">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="checkout" class="form-label">{% trans "Check-Out" %}</label>
                        <input required id="checkout" name="checkout" type="date" class="form-control">
                    </div>
                </div>
                <div class="col-md-12 mt-3">
                    <div class="form-group">
                        <label class="form-label text-light" for="obs">{% trans "Observations" %}</label>
                        <textarea maxlength="100" name="obs" id="obs" class="form-control" placeholder="{% trans "Ex.: Wedding anniversary decoration" %}"></textarea>
                    </div>
                </div>
                <div class="col-md-12 d-flex justify-content-center mt-3">
                    <button type="submit" class="btn btn-outline-info">{% trans "Submit" %}</button>
                </div>
            </div>
        </div>

        {% include "partials/_recaptcha_input.html" %}
    </form>

</div>

{% include "partials/_recaptcha_v3.html" %}
{% endblock content %}
