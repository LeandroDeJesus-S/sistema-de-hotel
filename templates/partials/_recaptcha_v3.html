<script>
    grecaptcha.ready(function() {
        $('#form').submit(function(e){
            e.preventDefault()

            const form = this;
            const key = "{{ recaptcha|escapejs }}";

            grecaptcha.execute(key, {action: 'generic'}).then(function(token) {
                $('#g-recaptcha-response').val(token)
                form.submit()
            });
        })
    });
</script>
